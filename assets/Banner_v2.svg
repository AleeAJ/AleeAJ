<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">AleDev / MoisesDev</title>
  <desc id="desc">AI Developer e Ingeniero de Informática. Fondo negro mate con reflejos perlados.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08090B"/>
      <stop offset=".52" stop-color="#111214"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <radialGradient id="pearl" cx="50%" cy="50%" r="50%">
      <stop stop-color="#D9D9DE" stop-opacity=".12"/>
      <stop offset="1" stop-color="#AEB0B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#D9D9DE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#D9D9DE" stop-opacity=".72"/>
      <stop offset="1" stop-color="#D9D9DE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9C9CF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="540" fill="url(#background)"/>
  <ellipse cx="260" cy="50" rx="480" ry="300" fill="url(#pearl)"/>
  <ellipse cx="1370" cy="500" rx="470" ry="320" fill="url(#pearl)"/>
  <path d="M0 1H1600M0 539H1600" stroke="#E1E1E5" stroke-opacity=".2"/>
  <path d="M500 400H1100" stroke="url(#shine)" stroke-width="1.5"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="800" y="249" font-size="112" font-weight="800" letter-spacing="10" fill="url(#name)">ALEDEV</text>
    <text x="800" y="309" font-size="34" font-weight="500" letter-spacing="11" fill="#D0D0D5">MOISESDEV</text>
    <path d="M690 354H910" stroke="url(#shine)" stroke-width="1.5"/>
    <text x="800" y="393" font-size="18" font-weight="500" letter-spacing="3" fill="#E2E2E5">AI DEVELOPER  ·  INGENIERO DE INFORMÁTICA</text>
  </g>
</svg>
