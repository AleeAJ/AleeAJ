<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title description">
<title id="title">AleDev</title>
<desc id="description">Banner claro minimalista con el nombre AleDev.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F3F3F1"/>
    <stop offset=".52" stop-color="#E9E9E6"/>
    <stop offset="1" stop-color="#F1F1EF"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop stop-color="#FFFFFF" stop-opacity=".8"/>
    <stop offset="1" stop-color="#F3F3F1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#D0D0CD"/>
    <stop offset=".5" stop-color="#B9B9B5"/>
    <stop offset="1" stop-color="#D0D0CD"/>
  </linearGradient>
</defs>
<rect width="1600" height="430" fill="url(#background)"/>
<ellipse cx="800" cy="215" rx="560" ry="260" fill="url(#glow)"/>
<text x="800" y="250" text-anchor="middle" fill="#202122" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="600" letter-spacing="10">AleDev</text>
<rect x="1" y="1" width="1598" height="428" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>