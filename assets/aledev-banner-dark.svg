</defs>
<rect width="1600" height="430" fill="url(#background)"/>
<ellipse cx="800" cy="215" rx="560" ry="260" fill="url(#glow)"/>
<text x="800" y="250" text-anchor="middle" fill="#F2F2F0" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="600" letter-spacing="10">AleDev</text>
