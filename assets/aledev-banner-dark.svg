<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title description">
<title id="title">AleDev</title>
<desc id="description">Banner oscuro minimalista con el nombre AleDev.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#101112"/>
    <stop offset=".52" stop-color="#090A0B"/>
    <stop offset="1" stop-color="#141516"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop stop-color="#27292B" stop-opacity=".72"/>
